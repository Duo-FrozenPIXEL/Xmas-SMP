name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resourcepack:
    name: Ressourcenpaket prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validieren und bauen
        run: python3 tools/resourcepack.py build
      - uses: actions/upload-artifact@v4
        with:
          name: resourcepack
          path: build/Xmas-SMP-resourcepack.zip

  common:
    name: Kern (Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew :common:build -Pxmassmp.skipFabric
      - name: Testbericht
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: common-test-report
          path: common/build/reports/tests/

  fabric:
    name: Fabric ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    needs: common
    strategy:
      fail-fast: false
      matrix:
        # Weitere Versionen (26.1 – 26.3) kommen mit dem Multi-Version-Setup (todo.md, 3.1).
        minecraft: ["1.21.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew :fabric:build -Pminecraft_version=${{ matrix.minecraft }}
      - uses: actions/upload-artifact@v4
        with:
          name: xmas-smp-fabric-${{ matrix.minecraft }}
          path: fabric/build/libs/*.jar
